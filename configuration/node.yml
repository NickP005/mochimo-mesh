#
# local_mode: true
# node_port: 2095
# settings_path: "configuration/interface_settings.json"
# tfile_path: "mochimo/bin/d/tfile.dat"
# txclean_path: "mochimo/bin/d/txclean.dat"
# connection_timeout: 5
# max_retry_attempts: 1
# node_rotation_enabled: false
# node_discovery:
#   enable: false

